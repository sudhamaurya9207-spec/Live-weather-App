<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Weather Web App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .weather-app {
      background: greenyellow;
      width: 320px;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4a6cf7;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background: #364fc7;
    }

    .weather {
      display: none;
    }

    .temp {
      font-size: 40px;
      margin: 10px 0;
    }

    .city {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .desc {
      color: #555;
      margin-bottom: 10px;
    }

    .details {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-size: 14px;
    }

    .error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="weather-app">
    <h1>🌤 Live Weather App</h1>

    <div class="search">
      <input type="text" id="cityInput" placeholder="Enter city name" />
      <button onclick="getWeather()">Search</button>
    </div>

    <div class="weather" id="weather">
      <div class="city" id="city"></div>
      <div class="temp" id="temp"></div>
      <div class="desc" id="desc"></div>

      <div class="details">
        <div>💧 Humidity: <span id="humidity"></span>%</div>
        <div>🌬 Wind: <span id="wind"></span> km/h</div>
      </div>
    </div>

    <div class="error" id="error"></div>
  </div>

  <script>
    const apiKey = "5a5e4e2ba22e86b18791af63aaa2c038";

function getWeather() {
  const city = document.getElementById("cityInput").value;
  const weatherBox = document.getElementById("weather");
  const errorBox = document.getElementById("error");

  if (city === "") {
    errorBox.innerText = "Please enter a city name";
    weatherBox.style.display = "none";
    return;
  }

  errorBox.innerText = "";

  fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`)
    .then(response => response.json())
    .then(data => {
      if (data.cod !== 200) {
        errorBox.innerText = "City not found";
        weatherBox.style.display = "none";
        return;
      }

      document.getElementById("city").innerText =
        `${data.name}, ${data.sys.country}`;

      document.getElementById("temp").innerText =
        `${Math.round(data.main.temp)}°C`;

      document.getElementById("desc").innerText =
        data.weather[0].description;

      document.getElementById("humidity").innerText =
        data.main.humidity;

      document.getElementById("wind").innerText =
        Math.round(data.wind.speed * 3.6); // m/s to km/h

      weatherBox.style.display = "block";
    })
    .catch(() => {
      errorBox.innerText = "Something went wrong!";
      weatherBox.style.display = "none";
    });
}
  </script>

</body>
</html>
